# On a normal run the console shows just the message: the level and class name are noise to
# someone syncing files. -debug swaps in the detailed pattern via this system property and
# reconfigures, see KSync3.configureLogging.
status = warn
name = ksync

appender.console.type = Console
appender.console.name = STDOUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = ${sys:ksync.logPattern:-%m%n}

rootLogger.level = info
rootLogger.appenderRef.stdout.ref = STDOUT

# The server sends cookies that httpclient's RFC6265 spec refuses to store (wrong domain, etc).
# Harmless here: ksync reads Set-Cookie straight off the response headers and injects its auth
# cookies into the store by hand, so it never reads what this rejects. Only the noise is a problem.
logger.cookies.name = org.apache.http.client.protocol.ResponseProcessCookies
logger.cookies.level = error

# milton-client narrates every POST and PROPFIND at info; useful when diagnosing, noise otherwise.
# -debug does not raise this, deliberately: it is someone else's wire logging.
logger.miltonclient.name = io.milton.httpclient
logger.miltonclient.level = warn

logger.springframework.name = org.springframework
logger.springframework.level = warn

logger.jsonlib.name = net.sf.json
logger.jsonlib.level = warn

logger.ical4j.name = net.fortuna.ical4j
logger.ical4j.level = warn

# hashsplit4j narrates every blob it stores at info, which on a lib of any size is thousands of
# lines and drowns out the few that matter. Its warnings are worth keeping though - HIT BLOB LIMIT
# comes through here - so this quiets the narration rather than the logger.
logger.hashsplit.name = org.hashsplit4j
logger.hashsplit.level = warn
